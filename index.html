<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click That Links</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #fdf8f3;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .logo img { max-width: 220px; }
    .tagline { color: #555; margin-bottom: 20px; }

    .search-form { margin: 20px auto; display: flex; justify-content: center; gap: 10px; }
    input[type="text"] { padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 20px; background: #fdd835; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #fbc02d; }

    h2 { color: #555; margin-top: 20px; }
    .category-bar { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 20px 0; }

    #resultArea {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .product-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }
    .product-card img { max-width: 150px; margin-bottom: 10px; }
    .links a {
      color: #e53935;
      font-weight: bold;
      text-decoration: none;
      margin: 0 5px;
    }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="logo"><img src="Click That Links.svg" alt="Click That Links"></div>
  <div class="tagline">Find your product fast</div>

  <div class="search-form">
    <input type="text" id="productQuery" placeholder="Enter Product ID or Name">
    <button onclick="searchProduct()">Search</button>
  </div>

  <h2>Shop by Categories</h2>
  <div id="categoryBar" class="category-bar"></div>

  <div id="resultArea"></div>

  <script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/1mA0IUMZ5CeR_SEkuBZLetdpuUlyttcaSQEaTbHkp9Io/pub?gid=0&single=true&output=csv";

    async function loadProducts() {
      const response = await fetch(SHEET_URL);
      const text = await response.text();
      const rows = text.split("\n").map(r => r.split(","));
      const products = [];
      for (let i = 1; i < rows.length; i++) {
        if (rows[i].length < 8) continue;
        const [category, id, name, image, amazonUS, amazonCA, amazonUK, amazonDE] = rows[i];
        if (!id || !name) continue;
        products.push({
          category: category.trim(),
          id: id.trim(),
          name: name.trim(),
          image: image.trim(),
          links: {
            us: amazonUS.trim(),
            ca: amazonCA.trim(),
            uk: amazonUK.trim(),
            de: amazonDE.trim()
          }
        });
      }
      return products;
    }

    async function loadCategories() {
      const products = await loadProducts();
      const categories = [...new Set(products.map(p => p.category))];
      const categoryBar = document.getElementById("categoryBar");
      categoryBar.innerHTML = categories.map(cat => `
        <button onclick="filterCategory('${cat}')">${cat}</button>
      `).join("");
    }

    async function searchProduct() {
      const query = document.getElementById("productQuery").value.trim().toLowerCase();
      const resultArea = document.getElementById("resultArea");
      resultArea.innerHTML = "<p>Searching...</p>";
      const products = await loadProducts();
      const filtered = products.filter(p =>
        p.id.toLowerCase() === query || p.name.toLowerCase().includes(query)
      );
      displayProducts(filtered, resultArea);
    }

    async function filterCategory(category) {
      const resultArea = document.getElementById("resultArea");
      resultArea.innerHTML = `<p>Loading ${category} products...</p>`;
      const products = await loadProducts();
      const filtered = products.filter(p => p.category === category);
      displayProducts(filtered, resultArea);
    }

    function displayProducts(products, resultArea) {
      if (products.length === 0) {
        resultArea.innerHTML = "<p>No products found.</p>";
        return;
      }
      resultArea.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.image}" alt="${p.name}">
          <h3>${p.name}</h3>
          <div class="links">
            <a href="${p.links.us}" target="_blank">Amazon US</a> |
            <a href="${p.links.ca}" target="_blank">Amazon CA</a> |
            <a href="${p.links.uk}" target="_blank">Amazon UK</a> |
            <a href="${p.links.de}" target="_blank">Amazon DE</a>
          </div>
        </div>
      `).join("");
    }

    window.onload = () => {
      loadCategories();
    };
  </script>

</body>
</html>
