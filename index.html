<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClickThatLinks</title>
  <style>
    /* Reset basic style */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
      line-height: 1.6;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    /* Search container */
    .search-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-container input,
    .search-container button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .search-container button {
      background: #007bff;
      color: #fff;
      cursor: pointer;
    }

    .search-container button:hover {
      background: #0056b3;
    }

    /* Product result card */
    .result {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
      margin-bottom: 20px;
    }

    .result img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .result h3 {
      margin-bottom: 10px;
    }

    .buy-btn {
      display: inline-block;
      padding: 10px 15px;
      background: #28a745;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
    }

    .buy-btn:hover {
      background: #218838;
    }

    /* Responsive layout */
    @media (min-width: 768px) {
      .search-container {
        flex-direction: row;
      }
      .search-container input {
        flex: 1;
      }
      .search-container button {
        width: auto;
      }
      .result {
        max-width: 600px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <h1>ClickThatLinks 🛒</h1>
  <div class="search-container">
    <input type="text" id="productId" placeholder="Enter Product ID">
    <button onclick="searchProduct()">Search</button>
  </div>
  <div id="resultArea"></div>

  <script>
    const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdW9xMAPS-7X1PHLBkwQdaV3yBokZzmpmT61uDk4s3zbTcENvboK5qFrzNWbMykfJ-SNUzoz-3Wxqk/pub?output=csv;

    async function loadProducts() {
      const response = await fetch(url);
      const data = await response.text();
      const rows = data.split("\n").map(row => row.split(","));
      const products = {};
      rows.forEach(row => {
        const [id, name, image, link] = row;
        if (id && name && image && link) {
          products[id.trim()] = { name, image, link };
        }
      });
      return products;
    }

    async function searchProduct() {
      const id = document.getElementById("productId").value.trim();
      const products = await loadProducts();
      const product = products[id];
      const resultArea = document.getElementById("resultArea");

      if (product) {
        resultArea.innerHTML = `
          <div class="result">
            <h3>Product ID ${id}</h3>
            <img src="${product.image}" alt="${product.name}">
            <div><strong>${product.name}</strong></div>
            <a class="buy-btn" href="${product.link}" target="_blank">Buy Now</a>
          </div>
        `;
      } else {
        resultArea.innerHTML = `<p>Product not found. Please check the ID.</p>`;
      }
    }
  </script>
</body>
</html>
