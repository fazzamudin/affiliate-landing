
<!DOCTYPE html>
<html lang="en">
<head>

   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width; initial-scale=1.0">
   <style>
      
    * {
      box-sizing: 10px;
    }
    body {
      font-family: sans-serif;
      background-color: #fdf8f3;
      text-align: center;
      padding: 20px 20px;
      margin: 0;
    }
    .tagline {
      font-size: 16px;
      color: #555;
      margin-bottom: 30px;
    }
    .search-form {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 400px;
      margin: 0 auto;
    }
    input[type="text"] {
      padding: 12px;
      width: 100%;
      max-width: 250px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      padding: 12px 24px;
      background-color: #fdd835;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      touch-action: manipulation;
    }
    button:hover {
      background-color: #fbc02d;
    }
    button:active {
      background-color: #f9a825;
    }
    .result {
      margin-top: 30px;
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 8px;
      background-color: #fff;
      display: inline-block;
      max-width: 90%;
      width: 300px;
    }
    .result img {
      width: 100%;
      max-width: 150px;
      height: auto;
      margin-bottom: 10px;
    }
    .buy-btn {
      display: block;
      margin-top: 10px;
      padding: 12px;
      background-color: #e53935;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
    }
    .buy-btn:hover {
      background-color: #c62828;
    }
    .buy-btn:active {
      background-color: #b71c1c;
    }
    .error {
      color: #e53935;
      margin-top: 20px;
    }
    .loading {
      color: #555;
      margin-top: 20px;
    }

    /* Mobile-specific styles */
    @media (max-width: 480px) {
      body {
        padding: 20px 15px;
      }
      .logo {
        font-size: 24px;
      margin-bottom: 20px;
      }
      .tagline {
        font-size: 14px;
        margin-bottom: 20px;
      }
      .search-form {
        flex-direction: column;
        align-items: center;
      }
      input[type="text"] {
        max-width: 100%;
      }
      button {
        width: 100%;
        max-width: 250px;
      }
      .result {
        width: 100%;
        max-width: 100%;
        padding: 15px;
      }
      .result img {
        max-width: 120px;
      }
    }
  </style>
</head>
<body>

  <!-- Logo + tagline -->
  <div class="header">
    <img src="ClickThatLinks.png" alt="Click That Links Logo">
  <div class="tagline">Find your product fast</div>

  <div class="search-form">
    <input type="text" id="productId" placeholder="Enter Product ID">
    <button onclick="searchProduct()">Search</button>
  </div>

  <div id="resultArea"></div>

  <script>
// Google Sheets ID extracted from the URL
const SHEET_ID = "1mA0IUMZ5CeR_SEkuBZLetdpuUlyttcaSQEaTbHkp9Io";

// Use the published CSV export URL format for Google Sheets
// Note: The sheet must be published to web for this to work
// (File > Share > Publish to web > CSV)
function getSheetUrl() {
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
}

async function loadProducts() {
  const url = getSheetUrl();
  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Failed to load products. Make sure the Google Sheet is published to web.");
  }

  const text = await response.text();
  const rows = text.split("\n").map(r => {
    // Handle CSV parsing with potential commas in values
    const result = [];
    let current = '';
    let inQuotes = false;

    for (let i = 0; i < r.length; i++) {
      const char = r[i];
      if (char === '"') {
        inQuotes = !inQuotes;
      } else if (char === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current.trim());
    return result;
  });

  const products = {};
  rows.slice(1).forEach(r => {
    if (r.length >= 4 && r[0]) {
      const id = r[0];
      products[id] = {
        name: r[1],
        image: r[2],
        link: r[3]
      };
    }
  });
  return products;
}

async function searchProduct() {
  const id = document.getElementById("productId").value.trim();
  const resultArea = document.getElementById("resultArea");

  if (!id) {
    resultArea.innerHTML = `<p class="error">Please enter a Product ID.</p>`;
    return;
  }

  resultArea.innerHTML = `<p class="loading">Searching...</p>`;

  try {
    const products = await loadProducts();
    const product = products[id];

    if (product) {
      resultArea.innerHTML = `
        <div class="result">
          <h3>Product ID ${id}</h3>
          <img src="${product.image}" alt="${product.name}">
          <div><strong>${product.name}</strong></div>
          <a class="buy-btn" href="${product.link}" target="_blank">Buy Now</a>
        </div>
      `;
    } else {
      resultArea.innerHTML = `<p class="error">Product not found. Please check the ID.</p>`;
    }
  } catch (error) {
    resultArea.innerHTML = `<p class="error">Error loading products: ${error.message}</p>`;
  }
}
</script>

</body>
</html>
